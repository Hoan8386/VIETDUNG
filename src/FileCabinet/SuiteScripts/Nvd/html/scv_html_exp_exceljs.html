        function adjustRowHeight(sheet, cellValue, rowIndex, extraHeightPer100Chars = 16) {
            let cell = sheet.getCell(`A${rowIndex}`);
            let textLength = cellValue.length;
            let numExtraLines = Math.ceil(textLength / 100);
            let newHeight1 = numExtraLines * extraHeightPer100Chars;
            sheet.getRow(rowIndex).height = newHeight1;
            cell.alignment = {horizontal: 'left', vertical: 'top', wrapText: true};
        }

        function adjustRowHeight1(sheet, cellValue, rowIndex, extraHeightPer50Chars = 16) {
            let cell = sheet.getCell(`A${rowIndex}`);
            let lines = cellValue.split('\n');
            let totalHeight = 0;

            lines.forEach(line => {
                let lineLength = line.length;

                if (lineLength > 50) {
                    // Nếu dòng có hơn 50 ký tự, tính chiều cao theo ký tự
                    let numExtraLines = Math.ceil(lineLength / 50);
                    totalHeight += numExtraLines * extraHeightPer50Chars;

        // hàm clone template xuống dưới trên cùng sheet đó, dùng cho nhãn in nhieeuf trên 1 tờ A4....
        const cloneLabelsTemplate = (worksheet, arrData, templateStartRow, templateEndRow, imageId = null) => {
            const formHeight = templateEndRow - templateStartRow + 1;
            const numCopies = arrData.length;

            for (let i = 1; i < numCopies; i++) {
                const rowOffset = i * formHeight;

                // Copy merged cells
                worksheet.model.merges.forEach((mergeRange) => {
                    const [startCell, endCell] = mergeRange.split(':');
                    const startRow = parseInt(startCell.replace(/[A-Z]/g, ''), 10);
                    const endRow = parseInt(endCell.replace(/[A-Z]/g, ''), 10);
                    const startCol = startCell.replace(/[0-9]/g, '');
                    const endCol = endCell.replace(/[0-9]/g, '');

                    if (startRow >= templateStartRow && endRow <= templateEndRow) {
                        worksheet.mergeCells(
                            `${startCol}${startRow + rowOffset}:${endCol}${endRow + rowOffset}`
                        );
                    }
                });

                for (let r = templateStartRow; r <= templateEndRow; r++) {
                    const sourceRow = worksheet.getRow(r);
                    const targetRow = worksheet.getRow(r + rowOffset);
                    targetRow.height = sourceRow.height;
                    sourceRow.eachCell({ includeEmpty: true }, (cell, colNumber) => {
                        const targetCell = targetRow.getCell(colNumber);
                        targetCell.value = cell.value;

                        // Copy style
                        targetCell.style = { ...cell.style };
                    });
                }
                // Clone the image
                worksheet.addImage( imageId, {
                    tl: { col: 0, row: rowOffset }, // Adjust the row offset for the new image
                    br: { col: 1, row: rowOffset + 1 }, // Adjust the bottom-right corner
                });
            }
        }

        const getPositionCell = (_ws, _pos) => {
            let objPos = {row: 1, col: 1, address: "A1"};

            if (typeof _pos == "string") {
                objPos.address = _pos.toUpperCase();

                let cell_start = _ws.getCell(objPos.address);

                objPos.row = cell_start.row;
                objPos.col = cell_start.col;
            } else if (typeof _pos == "object") {
                objPos.row = _pos.row || 1;
                objPos.col = _pos.col || 1;

                let cell_start = _ws.getCell(objPos.row, objPos.col);

                objPos.address = cell_start._address;
            }

            return objPos;
        }

        const syncRangeMergeAfterInsertRow = (_ws, _rowStartInsert, _numLineInserted) => {
            let arrRangeMerge = _ws.model.merges;
            let arrRangeMergeFinal = [];
            for (let i = 0; i < arrRangeMerge.length; i++) {
                let address_range = arrRangeMerge[i];
                let address_cell_start = getPositionCell(_ws, address_range.split(":")[0]);
                let address_cell_end = getPositionCell(_ws, address_range.split(":")[1]);

                if (address_cell_start.row >= _rowStartInsert) {
                    _ws.unMergeCells(address_range);

                    arrRangeMergeFinal.push({
                        row_start: address_cell_start.row + _numLineInserted,
                        col_start: address_cell_start.col,
                        row_end: address_cell_end.row + _numLineInserted,
                        col_end: address_cell_end.col
                    })

                }
            }

            for (let i = 0; i < arrRangeMergeFinal.length; i++) {
                let objRangeMerge = arrRangeMergeFinal[i];
                _ws.mergeCells(objRangeMerge.row_start, objRangeMerge.col_start, objRangeMerge.row_end, objRangeMerge.col_end);
            }
        }

                    }
                    if (isFloat(cell.value) && colNumber !== 1) {
                        cell.alignment = {horizontal: 'right', vertical: 'middle'};
                        cell.numFmt = '#,###.##';
                    }
                    if(!isNaN(Number(cell.value)) && colNumber === 1){ // set cho ột thứ tự
                        cell.alignment = {horizontal: 'center', vertical: 'middle'};
                        cell.numFmt = '####';
                    }
                });
                idxRowData += 1;
            }
            curSheet.spliceRows(idxSourceRow, 1);
            syncRangeMergeAfterInsertRow(curSheet, idxSourceRow, arrLength - 1);
            return idxRowData - 1;
        }

        const isFloat = (n) => {
            return Number(n) === n && n % 1 !== 0;
        }
    </script>
